[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: fast unit test (no Azure, no network)
    integration: requires external services (skipped in CI by default)
    slow: long-running test
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
