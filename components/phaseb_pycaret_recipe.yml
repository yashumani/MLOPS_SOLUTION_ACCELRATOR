name: v3_phaseb_pycaret_recipe
version: 7
display_name: V3 Phase B - PyCaret Recipe
type: command
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
  recipe_name:
    type: string
outputs:
  metrics_json:
    type: uri_file
    mode: upload
  manifest_json:
    type: uri_file
    mode: upload
  best_model:
    type: uri_folder
    mode: upload
code: ../
command: >-
  python src/steps/phaseb_pycaret_recipe.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  --recipe_name ${{inputs.recipe_name}}
  --metrics_out ${{outputs.metrics_json}}
  --manifest_out ${{outputs.manifest_json}}
  --model_out ${{outputs.best_model}}
environment: azureml:mlops-v3-unified:4
