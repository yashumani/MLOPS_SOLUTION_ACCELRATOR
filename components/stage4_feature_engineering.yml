name: stage4_feature_engineering
version: 9
display_name: V3 Stage 4 - Engineering
type: command
is_deterministic: false
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
  recipe_name:
    type: string
    optional: true
outputs:
  fe_report:
    type: uri_folder
  dataset_out:
    type: uri_file
  train_out:
    type: uri_file
    description: Model-ready training rows with internal identity columns removed
  holdout_out:
    type: uri_file
    description: Model-ready holdout rows with canonical row identity for evaluation
code: ../
command: >-
  python src/steps/stage4_feature_engineering.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  $[[--recipe_name "${{inputs.recipe_name}}"]]
  --report_dir ${{outputs.fe_report}}
  --dataset_out ${{outputs.dataset_out}}
  --train_out ${{outputs.train_out}}
  --holdout_out ${{outputs.holdout_out}}
environment: azureml:mlops-v3-unified:33
history:
  enableMLflowTracking: true
