name: stage4_feature_engineering
version: 4
display_name: V3 Stage 4 - Engineering
type: command
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
outputs:
  fe_report:
    type: uri_folder
  dataset_out:
    type: uri_file
code: ../
command: >-
  python src/steps/stage4_feature_engineering.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  --report_dir ${{outputs.fe_report}}
  --dataset_out ${{outputs.dataset_out}}
environment: azureml:mlops-v3-unified:4