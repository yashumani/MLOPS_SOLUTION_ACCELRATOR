name: v3_s12_model_registration
version: 14
display_name: V3 Stage 12 - Model Registry
type: command
is_deterministic: false
description: |
  Registers the exact champion model version with metadata and run lineage.
  Passing and warning models remain unassigned until an operator promotes
  them. QualityDecision=block never registers.

inputs:
  champion_manifest:
    type: uri_file
    description: "Champion model manifest from final evaluation (JSON)"
  champion_model:
    type: uri_folder
    description: "Champion model artifact directory"
  config_name:
    type: string
    description: "Config file name for metadata tagging"
  execution_manifest:
    type: uri_file
    description: "Validated immutable execution identity from Phase B"

outputs:
  registry_info:
    type: uri_file
    description: "Model registry information (name, version, stage)"

code: ../

command: >
  python src/steps/s12_model_registration.py
  --champion_manifest ${{inputs.champion_manifest}}
  --champion_model ${{inputs.champion_model}}
  --config_name ${{inputs.config_name}}
  --execution_manifest ${{inputs.execution_manifest}}
  --registry_info ${{outputs.registry_info}}

environment: azureml:mlops-v3-registration:2

history:
  enableMLflowTracking: true
