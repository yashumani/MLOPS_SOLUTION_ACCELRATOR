name: v3_stage5_timeseries_train
version: 1
display_name: V3 Stage 5t - Time-Series Forecasting
description: >
  Runs ARIMA/SARIMA/ETS/Theta/Naive forecasting models from statsmodels.
  Only executes if Stage 1 detected time-series data; otherwise skips gracefully.
type: command
is_deterministic: false
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
outputs:
  metrics_json:
    type: uri_file
  manifest_json:
    type: uri_file
  best_model:
    type: uri_folder
code: ../
command: >-
  python src/steps/stage5_timeseries_train.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  --metrics_out ${{outputs.metrics_json}}
  --manifest_out ${{outputs.manifest_json}}
  --model_out ${{outputs.best_model}}
environment: azureml:mlops-v3-unified:23
history:
  enableMLflowTracking: true
