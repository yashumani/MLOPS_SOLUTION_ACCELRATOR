name: stage3_preprocessing
version: 7
display_name: V3 Stage 3 - Preprocessing
type: command
is_deterministic: false
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
  prep_report:
    type: uri_folder
  recipe_name:
    type: string
    optional: true
outputs:
  prep3_report:
    type: uri_folder
  dataset_out:
    type: uri_file
code: ../
command: >-
  python src/steps/stage3_preprocessing.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  --prep_report "${{inputs.prep_report}}"
  $[[--recipe_name "${{inputs.recipe_name}}"]]
  --report_dir ${{outputs.prep3_report}}
  --dataset_out ${{outputs.dataset_out}}
environment: azureml:mlops-v3-unified:33
history:
  enableMLflowTracking: true
