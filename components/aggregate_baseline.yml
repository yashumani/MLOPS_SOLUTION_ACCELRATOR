name: v3_aggregate_baseline
version: 7
display_name: V3 Stage 5z - Aggregate Baseline
description: Selects only complete comparable common-CV candidate evidence.
type: command
is_deterministic: false
inputs:
  config_name:
    type: string
  pycaret_manifest:
    type: uri_file
  pycaret_model:
    type: uri_folder
  flaml_manifest:
    type: uri_file
  flaml_model:
    type: uri_folder
  ts_manifest:
    type: uri_file
    optional: true
  ts_model:
    type: uri_folder
    optional: true
outputs:
  aggregate_report:
    type: uri_file
  champion_model:
    type: uri_folder
code: ../
command: >-
  python src/steps/aggregate_baseline.py
  --config configs/${{inputs.config_name}}
  --pycaret_manifest ${{inputs.pycaret_manifest}}
  --pycaret_model ${{inputs.pycaret_model}}
  --flaml_manifest ${{inputs.flaml_manifest}}
  --flaml_model ${{inputs.flaml_model}}
  $[[--ts_manifest ${{inputs.ts_manifest}}]]
  $[[--ts_model ${{inputs.ts_model}}]]
  --report_out ${{outputs.aggregate_report}}
  --champion_out ${{outputs.champion_model}}
environment: azureml:mlops-v3-unified:32
history:
  enableMLflowTracking: true
