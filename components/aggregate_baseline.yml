name: v3_aggregate_baseline
version: 3
display_name: V3 Stage 5z - Aggregate Baseline
type: command
inputs:
  config_name:
    type: string
  pycaret_manifest:
    type: uri_file
  pycaret_model:
    type: uri_folder
  flaml_manifest:
    type: uri_file
  flaml_model:
    type: uri_folder
outputs:
  aggregate_report:
    type: uri_file
  champion_model:
    type: uri_folder
code: ../
command: python src/steps/aggregate_baseline.py --config configs/${{inputs.config_name}} --pycaret_manifest ${{inputs.pycaret_manifest}} --pycaret_model ${{inputs.pycaret_model}} --flaml_manifest ${{inputs.flaml_manifest}} --flaml_model ${{inputs.flaml_model}} --report_out ${{outputs.aggregate_report}} --champion_out ${{outputs.champion_model}}
environment: azureml:mlops-v3-unified:4
