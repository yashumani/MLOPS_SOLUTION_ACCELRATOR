name: v3_aggregate_phasec
version: 6
display_name: s09 - V3 Phase C - Aggregate
type: command
is_deterministic: false
inputs:
  config_name:
    type: string
  hpo_metrics_json:
    type: uri_file
  optimized_model:
    type: uri_folder
outputs:
  aggregate_report:
    type: uri_file
  optimized_champion_model:
    type: uri_folder
code: ../
command: >-
  python src/steps/aggregate_phasec.py
  --config configs/${{inputs.config_name}}
  --hpo_metrics ${{inputs.hpo_metrics_json}}
  --optimized_model ${{inputs.optimized_model}}
  --report_out ${{outputs.aggregate_report}}
  --champion_out ${{outputs.optimized_champion_model}}
environment: azureml:mlops-v3-unified:23
history:
  enableMLflowTracking: true
