# FORCE RE-REGISTRATION: 2026-02-08 - V3-Proposed Planner Mode (v7)
name: v3_phaseb_variant_runner
version: 15
display_name: s06 - V3 Phase B - Variant Runner - Planner Mode
type: command
is_deterministic: false

inputs:
  config_name:
    type: string
    description: Config YAML filename
  variants_list:
    type: string
    optional: true
    default: ""
    description: Bounded compatibility list for older direct callers
  candidate_catalog:
    type: uri_file
    optional: true
    description: Immutable complete recipe and CandidateRecord catalog
  execution_manifest:
    type: uri_file
    description: Immutable schema-v2 execution manifest from the submitter
  split_manifest:
    type: uri_file
    description: Immutable Stage 2 train/locked-test split evidence
  engine_list:
    type: string
    default: "pycaret,flaml"
    description: Comma-separated list of engines to run
  dataset_in:
    type: uri_file
    description: Raw training partition from Stage 2; locked test excluded
  time_budget_per_variant:
    type: integer
    default: 300
    description: Time budget per variant in seconds
  flaml_min_budget:
    type: integer
    default: 1
    description: Deprecated compatibility input; no budget floor is applied
  phaseb_time_budget_sec:
    type: integer
    default: 10800
    description: Hard Phase B wall-clock ceiling
  # V3-Proposed Planner inputs
  planner_enabled:
    type: boolean
    default: false
    description: Enable V3-Proposed adaptive planner mode
  round1_max_variants:
    type: integer
    default: 40
    description: Max variants for Round 1 proxy training
  round2_max_variants:
    type: integer
    default: 8
    description: Max variants for Round 2 full training
  proxy_prune_threshold:
    type: number
    default: 0.50
    description: Proxy metric threshold for pruning
  cache_enabled:
    type: boolean
    default: true
    description: Enable preprocessing cache

outputs:
  leaderboard_csv:
    type: uri_file
    description: Leaderboard of all variant×engine results
  all_results_json:
    type: uri_file
    description: Complete results with full details
  champion_manifest:
    type: uri_file
    description: Champion model manifest
  champion_model:
    type: uri_folder
    description: Champion model artifacts
  execution_manifest_out:
    type: uri_file
    description: Validated immutable execution manifest
  split_manifest_out:
    type: uri_file
    description: Validated immutable split evidence
  quality_decision_out:
    type: uri_file
    description: Selection-only block decision pending locked final evaluation

code: ../

command: >-
  python src/steps/s06_phaseb_variant_runner.py
  --config_path configs/${{inputs.config_name}}
  $[[--candidate_catalog ${{inputs.candidate_catalog}}]]
  $[[--variants_list "${{inputs.variants_list}}"]]
  --execution_manifest ${{inputs.execution_manifest}}
  --split_manifest ${{inputs.split_manifest}}
  --engine_list ${{inputs.engine_list}}
  --dataset_in ${{inputs.dataset_in}}
  --output_dir ${{outputs.champion_model}}
  --leaderboard_out ${{outputs.leaderboard_csv}}
  --all_results_out ${{outputs.all_results_json}}
  --champion_manifest_out ${{outputs.champion_manifest}}
  --execution_manifest_out ${{outputs.execution_manifest_out}}
  --split_manifest_out ${{outputs.split_manifest_out}}
  --quality_decision_out ${{outputs.quality_decision_out}}
  --time_budget_per_variant ${{inputs.time_budget_per_variant}}
  --flaml_min_budget ${{inputs.flaml_min_budget}}
  --phaseb_time_budget_sec ${{inputs.phaseb_time_budget_sec}}
  $[[--planner_enabled]]
  --round1_max_variants ${{inputs.round1_max_variants}}
  --round2_max_variants ${{inputs.round2_max_variants}}
  --proxy_prune_threshold ${{inputs.proxy_prune_threshold}}
  --cache_enabled ${{inputs.cache_enabled}}
environment: azureml:mlops-v3-unified:32

history:
  enableMLflowTracking: true
