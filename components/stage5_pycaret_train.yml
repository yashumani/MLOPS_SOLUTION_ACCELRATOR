name: v3_stage5_pycaret_train
version: 4
display_name: V3 Stage 5a - Baseline PyCaret
type: command
inputs:
  config_name:
    type: string
  dataset_in:
    type: uri_file
outputs:
  metrics_json:
    type: uri_file
  manifest_json:
    type: uri_file
  best_model:
    type: uri_folder
code: ../
command: >-
  python src/steps/stage5_pycaret_train.py
  --config configs/${{inputs.config_name}}
  --dataset_in ${{inputs.dataset_in}}
  --metrics_out ${{outputs.metrics_json}}
  --manifest_out ${{outputs.manifest_json}}
  --model_out ${{outputs.best_model}}
environment: azureml:mlops-v3-unified:4