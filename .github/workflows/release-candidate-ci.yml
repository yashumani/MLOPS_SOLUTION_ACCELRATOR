name: Release Candidate CI

on:
  push:
    branches:
      - "codex_ys/**"
      - "feature/**"
      - "dev"
      - "dev-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            config/mlops_v3_unified_environment/conda_v32.yml

      - name: Materialize pinned Azure ML dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          python -m pip install pyyaml==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path("config/mlops_v3_unified_environment/conda_v32.yml")
          dependencies = yaml.safe_load(source.read_text(encoding="utf-8"))["dependencies"]
          pip_dependencies = next(item["pip"] for item in dependencies if isinstance(item, dict) and "pip" in item)
          Path(".ci-runtime-requirements.txt").write_text(
              "\n".join(pip_dependencies) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip install -r .ci-runtime-requirements.txt -r api/requirements.txt
          python -m pip check

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          -m "not integration and not requires_azure_ml and not slow"

  react:
    name: React checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
