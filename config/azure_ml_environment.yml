# Azure ML Environment Configuration
# This file defines the conda environment for Azure ML compute instances

name: savvy-minds-mlops-env
channels:
  - defaults
  - conda-forge
  - anaconda

dependencies:
  - python=3.9
  - pip
  - pandas>=1.3.0
  - numpy>=1.21.0
  - scikit-learn>=1.0.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - plotly>=5.0.0
  
  - pip:
    # Azure ML packages
    - azureml-core>=1.45.0
    - azureml-dataset-runtime>=1.45.0
    - azureml-automl-core>=1.45.0
    - azureml-train-automl-client>=1.45.0
    - azureml-explain-model>=1.45.0
    
    # MLflow packages
    - mlflow>=1.28.0
    - azureml-mlflow>=1.45.0
    
    # Additional ML packages
    - imbalanced-learn>=0.8.0
    - xgboost>=1.5.0
    - lightgbm>=3.3.0
    - catboost>=1.0.0
    
    # Data processing
    - openpyxl>=3.0.0
    - xlrd>=2.0.0
    
    # Utilities
    - pyyaml>=6.0
    - joblib>=1.1.0
    - tqdm>=4.62.0