
# Example configuration file for Savvy Minds MLOps Solution Accelerator
# This file defines the settings for a single pipeline run.

industry: finance

# Path to the dataset CSV file or a location recognized by Azure ML
dataset_path: data/finance_sample.csv

# Type of machine learning problem: classification, regression, or clustering
task_type: classification

# Metric used to rank models in the evaluation step
primary_metric: f1

# Whether to apply SMOTE to handle class imbalance (only for classification tasks)
imbalance_handling: true

# MLflow tracking URI - using Azure ML workspace
mlflow_tracking_uri: "azureml://eastus2.api.azureml.ms/mlflow/v1.0/subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/<AZURE_RESOURCE_GROUP>/providers/Microsoft.MachineLearningServices/workspaces/<AZURE_WORKSPACE_NAME>"

# Azure ML workspace configuration
azure_ml:
  subscription_id: "<AZURE_SUBSCRIPTION_ID>"
  resource_group: "<AZURE_RESOURCE_GROUP>"
  workspace_name: "<AZURE_WORKSPACE_NAME>"
  workspace_id: "12b6bc01-e563-4a39-9006-b7bb2efe45b7"
  location: "eastus2"
  tenant_id: "3bc05bc3-19d1-4d30-89c5-134f4b278b11"

  # Storage and services
  storage_account: "mlopsaccelerat7263606092"
  key_vault: "mlopsaccelerat1858934844"
  application_insights: "mlopsaccelerat4731181828"
  container_registry: "12b6bc01e5634a399006b7bb2efe45b7"

  # MLflow configuration
  mlflow_tracking_uri: "azureml://eastus2.api.azureml.ms/mlflow/v1.0/subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/<AZURE_RESOURCE_GROUP>/providers/Microsoft.MachineLearningServices/workspaces/<AZURE_WORKSPACE_NAME>"
  discovery_url: "https://eastus2.api.azureml.ms/discovery"

  # Compute and datastore settings (to be configured based on your setup)
  datastore_name: "workspaceblobstore"  # Default datastore name
  compute_target: "mlopspipelineciDS3V2"  # Update with your actual compute target name

# Drift monitoring settings (s13)
drift_monitoring:
  enabled: true
  psi_green: 0.1
  psi_yellow: 0.25
  concept_drift_threshold: 0.05
  cadence_override: null
