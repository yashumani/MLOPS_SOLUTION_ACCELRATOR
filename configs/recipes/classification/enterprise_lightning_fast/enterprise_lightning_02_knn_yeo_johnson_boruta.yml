recipe_name: enterprise_lightning_02_knn_yeo_johnson_boruta
version: '1.0'
description: KNN weighted imputation + Yeo-Johnson transform + Boruta selection
research_citations:
- 'Troyanskaya et al. (2001): KNN imputation for microarray data'
- 'Yeo & Johnson (2000): New family of power transformations'
- 'Kursa & Rudnicki (2010): Boruta feature selection algorithm'
stage3_preprocessing:
  imputation:
    method: knn
    n_neighbors: 5
    weights: distance
    research_note: Troyanskaya 2001 - weighted KNN outperforms mean imputation
  imbalance_handling:
    method: smote_enn
    sampling_strategy: auto
    k_neighbors: 5
    enn_n_neighbors: 3
    research_note: Batista et al. 2004 - SMOTE-ENN cleans noisy synthetic samples
  encoding:
    categorical_method: catboost
    research_note: Prokhorenkova et al. 2018 - CatBoost encoding prevents target leakage
  scaling:
    method: yeo_johnson
    standardize: true
    research_note: Yeo-Johnson 2000 - generalizes Box-Cox to handle all real numbers
stage4_feature_engineering:
  feature_selection:
    method: boruta
    max_iter: 100
    random_state: 42
    research_note: Boruta - finds all relevant features using Random Forest importance
performance_tier: lightning_fast
expected_runtime_seconds: 240
recommended_for:
- Datasets with complex missingness patterns
- Non-normal distributions
