recipe_name: enterprise_lightning_01_mice_quantile_permutation
version: '1.0'
description: MICE imputation + Quantile transform + Permutation importance (Research-backed,
  Kaggle-proven)
research_citations:
- 'van Buuren & Groothuis-Oudshoorn (2011): MICE imputation'
- 'Breiman (2001): Permutation importance for Random Forests'
stage3_preprocessing:
  imputation:
    method: iterative
    max_iter: 10
    estimator: BayesianRidge
    research_note: Multiple Imputation by Chained Equations - gold standard for missing
      data
  imbalance_handling:
    method: borderline_smote
    sampling_strategy: auto
    k_neighbors: 5
    m_neighbors: 10
    kind: borderline-1
    research_note: Han et al. 2005 - targets borderline samples between classes
  encoding:
    categorical_method: target
    smoothing: 1.0
    handle_unknown: value
    research_note: Micci-Barreca 2001 - prevents overfitting on rare categories
  scaling:
    method: quantile
    output_distribution: uniform
    n_quantiles: 1000
    research_note: Robust to outliers, preserves rank ordering, distributes uniformly
stage4_feature_engineering:
  feature_selection:
    method: permutation
    n_repeats: 10
    scoring: auto
    threshold: median
    research_note: Permutation importance - gold standard for feature importance
performance_tier: lightning_fast
expected_runtime_seconds: 180
recommended_for:
- Rapid prototyping
- Baseline establishment
- Resource-constrained environments
