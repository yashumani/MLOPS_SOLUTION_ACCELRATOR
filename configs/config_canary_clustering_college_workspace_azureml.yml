schema_version: "2.0"
experiment_name: canary_college_clustering_v3_azure
preset: diagnostic
task_type: clustering
random_seed: 42
holdout_fraction: 0.20
holdout_split_strategy: random

dataset:
  name: college_clustering_workspace_canary
  version: "1"
  blob_path: College.csv
  datastore_name: mlops_blob

azureml:
  subscription_id: 93044a08-5661-4f1b-b424-5eafe066a9d1
  resource_group: mvpv1
  workspace_name: mlops-accelerator
  compute_target: mlopsv2computecluster
  environment: mlops-v3-unified:32
  environment_name_preprocessing: mlops-v3-preprocessing
  environment_name_training: mlops-v3-training

stage1:
  min_rows: 100
  max_missing_pct: 50
  generate_sweetviz: false
  eda_sample_size: 5000

stage2:
  imputation_strategy: from_stage1
  statistical_tests_enabled: true

stage3:
  adaptive_scaling: true
  multicollinearity_check: true

stage4:
  selection_method: variance
  apply_pca_threshold: 50
  pca_variance_retained: 0.95
  imbalance_detection: false

split:
  strategy: random
  validation_fraction: 0.0
  test_fraction: 0.20
  cv_folds: 3
  locked_test: true

metrics:
  primary: silhouette
  selection_protocol: cross_validation
  cv_folds: 3
  locked_test_once: true
  min_comparable_candidates: 2

phases:
  phase_a_baseline:
    cv_folds: 3
    candidate_engine_timeout_seconds: 120
    flaml_config:
      time_budget: 120
  phase_b:
    enable_profiling: true
    profiling_output_path: outputs/dataset_profile.json
    library_dir: configs/recipes/clustering/v1_generated
    library: v1_generated
    tier: balanced_performance
    max_variants: 4
    runtime_budget_sec: 120
    time_budget_per_variant: 120
    phase_timeout_seconds: 1800
    safety_net_review_required: true
    engines: [pycaret]
    planner:
      enabled: true
      round1_max_variants: 4
      round2_max_variants: 2
      proxy_prune_threshold: 0.0
      diversity_min_hamming_distance: 2
      cache_enabled: true
  phase_c_hpo:
    optimizer: optuna
    n_trials: 5
    timeout_seconds: 600

registry:
  model_name: canary-college-clustering
  quality_failure_policy: warn
  warning_registration_allowed: true
  warning_tags:
    quality_decision: warn
    validation_scope: canary
  pass_aliases: []
  warning_aliases: []

recipes:
  - file: recipes/baseline_recipe.yml
