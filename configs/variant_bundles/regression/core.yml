bundle_name: "core"
description: >
  Essential baseline variants for regression — always enabled.
  Mean imputation, standard scaling, no outlier handling.
tags: ["core", "baseline", "always"]
default_enabled: true
gating_rules: []
variant_paths:
  - "configs/recipes/regression/baseline_recipe.yml"
variant_glob: "configs/recipes/regression/v1_generated/lightning_fast/*.yml"
max_variants: 8
