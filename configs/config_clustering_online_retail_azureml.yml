schema_version: "2.0"
experiment_name: online_retail_clustering_v3_azure
preset: production
task_type: clustering
random_seed: 42
holdout_fraction: 0.20
holdout_split_strategy: random

dataset:
  name: online_retail_clustering
  version: "1"
  # No target column for clustering (unsupervised learning)
  blob_path: online_retail.csv
  datastore_name: mlops_blob
  encoding: latin-1  # Online Retail data contains £ (pound sign) encoded in Latin-1

# V4 Enhancement: Stage 1 data quality configuration
stage1:
  min_rows: 100  # Minimum rows required for modeling
  max_missing_pct: 50  # Maximum allowed missing data percentage
  generate_sweetviz: true  # Generate sweetviz HTML report (production: false, debug: true)
  eda_sample_size: 10000  # Sample size for sweetviz to avoid memory issues

# V3 Redesign: Stage 2 advanced preparation
stage2:
  imputation_strategy: "from_stage1"  # Use Stage 1 intelligent recommendations
  statistical_tests_enabled: true  # Run normality, outlier, correlation tests

# V3 Redesign: Stage 3 smart preprocessing
stage3:
  adaptive_scaling: true  # Use test results to choose Standard vs Robust scaler
  multicollinearity_check: true  # VIF analysis

# V3 Redesign: Stage 4 advanced feature engineering
stage4:
  selection_method: "variance"  # Options: variance (clustering-friendly, no target needed), mutual_info, boruta
  apply_pca_threshold: 50  # Apply PCA if features > this threshold (lower for clustering)
  pca_variance_retained: 0.95  # Keep 95% variance when applying PCA
  imbalance_detection: false  # Not applicable for clustering

azureml:
  subscription_id: 93044a08-5661-4f1b-b424-5eafe066a9d1
  resource_group: mvpv1
  workspace_name: mlops-accelerator
  compute_target: mlopsv2computecluster
  environment: mlops-v3-unified:32
  environment_name_preprocessing: mlops-v3-preprocessing
  environment_name_training: mlops-v3-training

split:
  strategy: random
  validation_fraction: 0.0
  test_fraction: 0.20
  cv_folds: 5
  locked_test: true

metrics:
  primary: silhouette
  selection_protocol: cross_validation
  cv_folds: 5
  locked_test_once: true
  min_comparable_candidates: 2

phases:
  phase_b:
    enable_profiling: true
    profiling_output_path: outputs/dataset_profile.json
    library_dir: configs/recipes/clustering/v1_generated
    library: v1_generated
    tier: balanced_performance
    max_variants: 40
    runtime_budget_sec: 600
    time_budget_per_variant: 600
    phase_timeout_seconds: 10800
    safety_net_review_required: true
    engines: [pycaret]
    planner:
      enabled: true
      round1_max_variants: 40
      round2_max_variants: 8
      proxy_prune_threshold: 0.0
      diversity_min_hamming_distance: 2
      cache_enabled: true
  phase_c_hpo:
    optimizer: optuna
    n_trials: 50
    timeout_seconds: 3600

registry:
  model_name: online-retail-clustering
  quality_failure_policy: warn
  warning_registration_allowed: true
  warning_tags:
    quality_decision: warn
  pass_aliases: [champion]
  warning_aliases: []

recipes:
  - file: recipes/baseline_recipe.yml
