schema_version: "1.0"
matrix_name: mlops-v3-release-industry-matrix

privacy_review:
  scope: Public-data, non-production Azure ML release qualification only.
  reviewed_at: "2026-09-02"
  restrictions:
    - Do not use these qualification datasets or resulting models for production decisions.
    - Keep row-level data inside the authorized Azure ML workspace and datastore.
    - Enforce configured feature exclusions before preprocessing or training.
    - Publish aggregate metrics and lineage only; do not export row-level report samples.
  scenario_dispositions:
    classification-healthcare-heart-disease:
      status: approved_for_nonproduction_qualification
      rationale: Public UCI clinical measurements contain age and sex as quasi-identifiers but no direct identifier; restricted to non-production testing.
    classification-financial-services-credit-default:
      status: approved_for_nonproduction_qualification
      rationale: The versioned CC0 file is coded and the upstream identifier column was removed before staging.
    classification-telecommunications-customer-churn:
      status: approved_for_nonproduction_qualification
      rationale: Public UCI service-behavior data contains age attributes but no customer identifier; restricted to non-production testing.
    classification-manufacturing-machine-failure:
      status: approved_for_nonproduction_qualification
      rationale: Industrial sensor data is non-personal, and UDI plus Product ID are excluded from model features.
    classification-insurance-policy-interest:
      status: approved_for_nonproduction_qualification
      rationale: Public UCI demographic aggregates contain no direct customer identifier and are restricted to non-production testing.
    regression-education-final-grade:
      status: approved_for_nonproduction_qualification
      rationale: UCI defines address as the categorical urban-or-rural residence type, not a street address; age and sex remain quasi-identifiers and use is non-production only.
    regression-real-estate-unit-price:
      status: approved_for_nonproduction_qualification
      rationale: Public property observations contain coordinates but no person identifier; record_id is excluded and use is non-production only.
    regression-insurance-claim-cost:
      status: approved_for_nonproduction_qualification
      rationale: The CC0 file has ClaimNumber removed; age, gender, and claim text remain restricted to in-workspace non-production testing with no row-level export.
    regression-energy-building-heating-load:
      status: approved_for_nonproduction_qualification
      rationale: Building geometry and energy-response data contains no personal or direct identifier.
    regression-aviation-airfoil-noise:
      status: approved_for_nonproduction_qualification
      rationale: NASA airfoil test measurements contain no personal or direct identifier.
    clustering-healthcare-heart-cohorts:
      status: approved_for_nonproduction_qualification
      rationale: Public UCI clinical measurements contain age and sex as quasi-identifiers; the diagnosis outcome is excluded and use is non-production only.
    clustering-financial-services-risk-segments:
      status: approved_for_nonproduction_qualification
      rationale: The upstream identifier is absent and the default outcome is excluded, leaving coded CC0 behavior fields for non-production testing.
    clustering-telecommunications-behavior-segments:
      status: approved_for_nonproduction_qualification
      rationale: The churn outcome is excluded; age attributes remain quasi-identifiers and use is restricted to non-production testing.
    clustering-retail-transaction-segments:
      status: approved_for_nonproduction_qualification
      rationale: CustomerID, InvoiceNo, StockCode, and Description are excluded before modeling; remaining public transaction fields are non-production only.
    clustering-education-student-segments:
      status: approved_for_nonproduction_qualification
      rationale: Grade outcomes are excluded and UCI address is an urban-or-rural category rather than a street address; age and sex remain quasi-identifiers.

